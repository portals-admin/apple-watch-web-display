<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHRONO·X — Neural Time Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:   #00f5ff;
      --pink:   #ff0088;
      --purple: #9b30ff;
      --dark:   #000814;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated grid ──────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      animation: gridScroll 16s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes gridScroll {
      from { background-position: 0 0; }
      to   { background-position: 44px 44px; }
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%,
        transparent 25%, rgba(0,8,20,.85) 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Particles canvas ───────────────────────────────── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Ambient glow ───────────────────────────────────── */
    .ambient {
      position: fixed;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0,245,255,.07) 0%, transparent 65%);
      pointer-events: none;
      animation: ambientPulse 3.5s ease-in-out infinite alternate;
      z-index: 2;
    }
    @keyframes ambientPulse {
      from { transform: scale(.94); opacity: .5; }
      to   { transform: scale(1.06); opacity: 1; }
    }

    /* ── Corner hex decorations ─────────────────────────── */
    .hex-deco {
      position: fixed;
      pointer-events: none;
      opacity: .08;
      z-index: 1;
    }

    /* ── Watch wrapper ──────────────────────────────────── */
    .watch-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    /* ── Straps ─────────────────────────────────────────── */
    .strap-top, .strap-bottom {
      width: 134px;
      background: linear-gradient(180deg, #08111f 0%, #040a12 100%);
      position: relative;
      overflow: hidden;
    }
    .strap-top {
      height: 110px;
      border-radius: 14px 14px 0 0;
      border: 1px solid rgba(0,245,255,.2);
      border-bottom: none;
    }
    .strap-bottom {
      height: 110px;
      border-radius: 0 0 14px 14px;
      border: 1px solid rgba(0,245,255,.2);
      border-top: none;
    }

    /* Strap circuit pattern */
    .strap-top::before, .strap-bottom::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg,
          transparent, transparent 9px,
          rgba(0,245,255,.04) 9px, rgba(0,245,255,.04) 10px),
        repeating-linear-gradient(90deg,
          transparent, transparent 22px,
          rgba(0,245,255,.03) 22px, rgba(0,245,255,.03) 23px);
    }

    /* Strap connector glow line */
    .strap-top::after, .strap-bottom::after {
      content: '';
      position: absolute;
      left: 14px; right: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 8px var(--cyan);
      animation: strapGlow 2.5s ease-in-out infinite alternate;
    }
    .strap-top::after    { bottom: 0; }
    .strap-bottom::after { top: 0; }
    @keyframes strapGlow {
      from { opacity: .35; }
      to   { opacity: .9; }
    }

    /* ── Watch case ─────────────────────────────────────── */
    .watch-case {
      position: relative;
      width: 176px; height: 210px;
      background: linear-gradient(145deg, #0b1427 0%, #060c1a 50%, #0a1120 100%);
      border-radius: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: caseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes caseGlow {
      from {
        box-shadow:
          0 0 0 1px rgba(0,245,255,.3),
          0 0 0 2px rgba(0,245,255,.08),
          0 0 18px rgba(0,245,255,.15),
          0 0 50px rgba(0,245,255,.06),
          inset 0 1px 1px rgba(0,245,255,.08),
          0 30px 80px rgba(0,0,0,.9);
      }
      to {
        box-shadow:
          0 0 0 1px rgba(0,245,255,.7),
          0 0 0 2px rgba(0,245,255,.18),
          0 0 35px rgba(0,245,255,.3),
          0 0 80px rgba(0,245,255,.12),
          inset 0 1px 1px rgba(0,245,255,.15),
          0 30px 80px rgba(0,0,0,.9);
      }
    }

    /* Inner bevel ring */
    .watch-case::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 44px;
      border: 1px solid transparent;
      background:
        linear-gradient(#0b1427, #0b1427) padding-box,
        linear-gradient(135deg,
          rgba(0,245,255,.35), transparent 40%,
          transparent 60%, rgba(153,48,255,.25)) border-box;
      pointer-events: none;
    }

    /* ── Crown ──────────────────────────────────────────── */
    .crown {
      position: absolute;
      right: -12px; top: 50%;
      transform: translateY(-62%);
      width: 10px; height: 38px;
      background: linear-gradient(180deg, #0c1628 0%, #070d1c 100%);
      border-radius: 5px;
      border: 1px solid rgba(0,245,255,.5);
      box-shadow: 0 0 10px rgba(0,245,255,.25), inset 0 0 4px rgba(0,245,255,.08);
    }
    .crown::before {
      content: '';
      position: absolute;
      inset: 4px 2px;
      background: repeating-linear-gradient(0deg,
        rgba(0,245,255,.2) 0px, rgba(0,245,255,.2) 1px,
        transparent 1px, transparent 3px);
      border-radius: 3px;
    }
    .crown::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: crownPulse 2s ease-in-out infinite alternate;
    }
    @keyframes crownPulse {
      from { opacity: .5; box-shadow: 0 0 4px var(--cyan); }
      to   { opacity: 1;  box-shadow: 0 0 14px var(--cyan); }
    }

    /* ── Side button ────────────────────────────────────── */
    .side-btn {
      position: absolute;
      right: -10px; top: 50%;
      transform: translateY(140%);
      width: 8px; height: 22px;
      background: linear-gradient(180deg, #0c1628 0%, #070d1c 100%);
      border-radius: 4px;
      border: 1px solid rgba(0,245,255,.3);
      box-shadow: 0 0 6px rgba(0,245,255,.12);
    }

    /* ── Screen bezel ───────────────────────────────────── */
    .watch-screen-bezel {
      width: 152px; height: 186px;
      background: #000;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      box-shadow:
        inset 0 0 0 1px rgba(0,245,255,.12),
        inset 0 2px 12px rgba(0,0,0,.95);
    }

    /* ── Watch screen ───────────────────────────────────── */
    .watch-screen {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 25%,
        #021018 0%, #000306 100%);
      border-radius: 42px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
    }

    /* CRT scanlines */
    .watch-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
        transparent, transparent 2px,
        rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px);
      pointer-events: none;
      z-index: 20;
      border-radius: 42px;
    }

    /* ── Scan beam ──────────────────────────────────────── */
    .scan-beam {
      position: absolute;
      width: 100%; height: 3px;
      background: linear-gradient(90deg,
        transparent, rgba(0,245,255,.35), transparent);
      box-shadow: 0 0 12px rgba(0,245,255,.5);
      animation: scanDown 5s linear infinite;
      pointer-events: none;
      z-index: 21;
    }
    @keyframes scanDown {
      0%   { top: -3px; opacity: 0; }
      4%   { opacity: 1; }
      96%  { opacity: .7; }
      100% { top: 100%; opacity: 0; }
    }

    /* ── Holographic shimmer ────────────────────────────── */
    .holo {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg,
        transparent 0%, rgba(0,245,255,.025) 30%,
        transparent 50%, rgba(153,48,255,.025) 70%,
        transparent 100%);
      background-size: 200% 200%;
      animation: holoMove 6s ease-in-out infinite;
      border-radius: 42px;
      pointer-events: none;
      z-index: 19;
    }
    @keyframes holoMove {
      0%, 100% { background-position: 0% 0%; }
      50%       { background-position: 100% 100%; }
    }

    /* ── Corner brackets ────────────────────────────────── */
    .corners {
      position: absolute;
      inset: 10px;
      pointer-events: none;
      z-index: 6;
    }
    .corners::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 13px; height: 13px;
      border-top: 1px solid var(--cyan);
      border-left: 1px solid var(--cyan);
      filter: drop-shadow(0 0 4px var(--cyan));
    }
    .corners::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 13px; height: 13px;
      border-bottom: 1px solid var(--cyan);
      border-right: 1px solid var(--cyan);
      filter: drop-shadow(0 0 4px var(--cyan));
    }

    /* ── Status bar ─────────────────────────────────────── */
    .status-bar {
      position: absolute;
      top: 13px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 5;
    }
    .status-icon {
      font-size: 8px;
      color: var(--cyan);
      letter-spacing: .06em;
      opacity: .65;
    }

    /* ── Date complication ──────────────────────────────── */
    .complication-top {
      font-size: 9px;
      color: var(--cyan);
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 1px;
      opacity: .8;
      text-shadow: 0 0 8px var(--cyan);
      z-index: 5;
    }

    /* ── Clock face ─────────────────────────────────────── */
    .clock-face {
      position: relative;
      width: 106px; height: 106px;
      z-index: 5;
    }
    .clock-face svg { width: 100%; height: 100%; overflow: visible; }

    .tick-minor { stroke: rgba(0,245,255,.3); stroke-linecap: round; }
    .tick-major {
      stroke: rgba(0,245,255,.75);
      stroke-linecap: square;
      filter: drop-shadow(0 0 2px rgba(0,245,255,.9));
    }

    .hand-hour {
      stroke: var(--cyan);
      stroke-width: 4;
      stroke-linecap: square;
      transform-origin: 55px 55px;
      filter: drop-shadow(0 0 5px var(--cyan)) drop-shadow(0 0 10px rgba(0,245,255,.4));
      transition: transform .5s cubic-bezier(.4, 2.08, .55, .44);
    }
    .hand-minute {
      stroke: rgba(0,245,255,.8);
      stroke-width: 2.5;
      stroke-linecap: square;
      transform-origin: 55px 55px;
      filter: drop-shadow(0 0 3px var(--cyan));
      transition: transform .5s cubic-bezier(.4, 2.08, .55, .44);
    }
    .hand-second {
      stroke: var(--pink);
      stroke-width: 1.5;
      stroke-linecap: butt;
      transform-origin: 55px 55px;
      filter: drop-shadow(0 0 5px var(--pink)) drop-shadow(0 0 10px rgba(255,0,136,.5));
      transition: transform .18s cubic-bezier(.4, 2.08, .55, .44);
    }
    .hand-second-tail {
      stroke: var(--pink);
      stroke-width: 1.5;
      stroke-linecap: butt;
      transform-origin: 55px 55px;
      filter: drop-shadow(0 0 4px var(--pink));
      transition: transform .18s cubic-bezier(.4, 2.08, .55, .44);
    }

    .center-outer { fill: var(--pink); filter: drop-shadow(0 0 6px var(--pink)); }
    .center-ring  { fill: none; stroke: var(--cyan); stroke-width: 1; filter: drop-shadow(0 0 3px var(--cyan)); }
    .center-inner { fill: #000; }

    /* ── Digital time ───────────────────────────────────── */
    .digital-time {
      font-size: 12px;
      color: var(--cyan);
      letter-spacing: .14em;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(0,245,255,.3);
      animation: digitalGlitch 8s steps(1) infinite;
      z-index: 5;
    }
    @keyframes digitalGlitch {
      0%, 97%, 100% { clip-path: none; transform: none; }
      97.5%  { clip-path: inset(30% 0 50% 0); transform: translateX(2px); }
      98%    { clip-path: inset(60% 0 20% 0); transform: translateX(-2px); }
      98.5%  { clip-path: none; transform: none; }
    }

    /* ── Activity rings ─────────────────────────────────── */
    .activity-rings {
      position: absolute;
      bottom: 16px; right: 14px;
      width: 28px; height: 28px;
      z-index: 5;
      filter:
        drop-shadow(0 0 3px var(--pink))
        drop-shadow(0 0 5px rgba(0,245,255,.4));
    }

    /* ── Label ──────────────────────────────────────────── */
    .watch-label {
      margin-top: 22px;
      text-align: center;
      color: rgba(0,245,255,.3);
      font-size: 8px;
      letter-spacing: .35em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,245,255,.25);
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="ambient"></div>

<!-- Corner hex decorations -->
<svg class="hex-deco" style="top:-60px;left:-60px;width:220px;height:220px" viewBox="0 0 200 200">
  <polygon points="100,8 172,50 172,150 100,192 28,150 28,50"
    fill="none" stroke="#00f5ff" stroke-width="1"/>
  <polygon points="100,28 156,62 156,138 100,172 44,138 44,62"
    fill="none" stroke="#00f5ff" stroke-width=".5"/>
</svg>
<svg class="hex-deco" style="bottom:-60px;right:-60px;width:220px;height:220px" viewBox="0 0 200 200">
  <polygon points="100,8 172,50 172,150 100,192 28,150 28,50"
    fill="none" stroke="#9b30ff" stroke-width="1"/>
  <polygon points="100,28 156,62 156,138 100,172 44,138 44,62"
    fill="none" stroke="#9b30ff" stroke-width=".5"/>
</svg>
<svg class="hex-deco" style="top:-40px;right:60px;width:120px;height:120px;opacity:.05" viewBox="0 0 200 200">
  <polygon points="100,8 172,50 172,150 100,192 28,150 28,50"
    fill="none" stroke="#ff0088" stroke-width="1.5"/>
</svg>

<div class="watch-wrapper">
  <div class="strap-top"></div>

  <div class="watch-case">
    <div class="crown"></div>
    <div class="side-btn"></div>

    <div class="watch-screen-bezel">
      <div class="watch-screen">

        <div class="scan-beam"></div>
        <div class="holo"></div>
        <div class="corners"></div>

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-icon" id="status-time"></span>
          <span class="status-icon">▮ 87%</span>
        </div>

        <!-- Date -->
        <div class="complication-top" id="day-date"></div>

        <!-- Analog face -->
        <div class="clock-face">
          <svg viewBox="0 0 110 110">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Rings -->
            <circle cx="55" cy="55" r="52" fill="none"
              stroke="rgba(0,245,255,.08)" stroke-width=".5"/>
            <circle cx="55" cy="55" r="47" fill="none"
              stroke="rgba(0,245,255,.05)" stroke-width=".5"/>

            <!-- Ticks -->
            <g id="ticks"></g>

            <!-- Cardinal dots -->
            <circle cx="55" cy="7"   r="2" fill="var(--cyan)" filter="url(#glow)" opacity=".9"/>
            <circle cx="103" cy="55" r="1.2" fill="var(--cyan)" opacity=".55"/>
            <circle cx="55" cy="103" r="1.2" fill="var(--cyan)" opacity=".55"/>
            <circle cx="7"  cy="55"  r="1.2" fill="var(--cyan)" opacity=".55"/>

            <!-- Minute hand -->
            <line id="hand-minute" class="hand-minute" x1="55" y1="55" x2="55" y2="14"/>

            <!-- Hour hand -->
            <line id="hand-hour" class="hand-hour" x1="55" y1="55" x2="55" y2="24"/>

            <!-- Second hand -->
            <line id="hand-second-tail" class="hand-second-tail" x1="55" y1="55" x2="55" y2="69"/>
            <line id="hand-second"      class="hand-second"      x1="55" y1="55" x2="55" y2="10"/>

            <!-- Center hub -->
            <circle cx="55" cy="55" r="5.5" class="center-outer"/>
            <circle cx="55" cy="55" r="3.5" class="center-ring"/>
            <circle cx="55" cy="55" r="1.8" class="center-inner"/>
          </svg>
        </div>

        <!-- Digital time -->
        <div class="digital-time" id="digital-time"></div>

        <!-- Activity rings -->
        <svg class="activity-rings" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="12" fill="none"
            stroke="rgba(255,0,136,.2)" stroke-width="2.5"/>
          <circle cx="14" cy="14" r="12" fill="none"
            stroke="#ff0088" stroke-width="2.5"
            stroke-dasharray="75.4" stroke-dashoffset="18"
            stroke-linecap="round" transform="rotate(-90 14 14)"/>

          <circle cx="14" cy="14" r="8.5" fill="none"
            stroke="rgba(0,245,255,.2)" stroke-width="2.5"/>
          <circle cx="14" cy="14" r="8.5" fill="none"
            stroke="#00f5ff" stroke-width="2.5"
            stroke-dasharray="53.4" stroke-dashoffset="14"
            stroke-linecap="round" transform="rotate(-90 14 14)"/>

          <circle cx="14" cy="14" r="5" fill="none"
            stroke="rgba(153,48,255,.2)" stroke-width="2.5"/>
          <circle cx="14" cy="14" r="5" fill="none"
            stroke="#9b30ff" stroke-width="2.5"
            stroke-dasharray="31.4" stroke-dashoffset="10"
            stroke-linecap="round" transform="rotate(-90 14 14)"/>
        </svg>

      </div>
    </div>
  </div>

  <div class="strap-bottom"></div>
  <div class="watch-label">CHRONO·X &nbsp;// &nbsp;NEURAL TIME INTERFACE</div>
</div>

<script>
  /* ── Floating particles ──────────────────────────────── */
  (function () {
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    resize();
    window.addEventListener('resize', resize);

    const pts = Array.from({ length: 45 }, () => ({
      x:  Math.random() * innerWidth,
      y:  Math.random() * innerHeight,
      vx: (Math.random() - .5) * .28,
      vy: (Math.random() - .5) * .28,
      r:  Math.random() * 1.4 + .4,
      a:  Math.random() * .45 + .08,
    }));

    (function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach(p => {
        p.x = (p.x + p.vx + canvas.width)  % canvas.width;
        p.y = (p.y + p.vy + canvas.height) % canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,245,255,${p.a})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    })();
  })();

  /* ── Build tick marks ────────────────────────────────── */
  (function () {
    const g = document.getElementById('ticks');
    const cx = 55, cy = 55, r = 49;
    for (let i = 0; i < 60; i++) {
      const angle   = (i * 6 - 90) * Math.PI / 180;
      const isMajor = i % 5 === 0;
      const len     = isMajor ? 8 : 4;
      const x1 = cx + r           * Math.cos(angle);
      const y1 = cy + r           * Math.sin(angle);
      const x2 = cx + (r - len)   * Math.cos(angle);
      const y2 = cy + (r - len)   * Math.sin(angle);
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
      ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
      ln.setAttribute('stroke-width', isMajor ? '2' : '.8');
      ln.setAttribute('stroke-linecap', isMajor ? 'square' : 'round');
      ln.setAttribute('class', isMajor ? 'tick-major' : 'tick-minor');
      g.appendChild(ln);
    }
  })();

  /* ── Clock ───────────────────────────────────────────── */
  const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN',
                  'JUL','AUG','SEP','OCT','NOV','DEC'];
  let prevSec = -1;

  function setAngle(id, deg) {
    document.getElementById(id).style.transform = `rotate(${deg}deg)`;
  }

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(),
          s = now.getSeconds(), ms = now.getMilliseconds();

    setAngle('hand-hour',        ((h % 12) + m / 60 + s / 3600) * 30);
    setAngle('hand-minute',      (m + (s + ms / 1000) / 60) * 6);
    setAngle('hand-second',      (s + ms / 1000) * 6);
    setAngle('hand-second-tail', (s + ms / 1000) * 6);

    if (s !== prevSec) {
      prevSec = s;
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      document.getElementById('digital-time').textContent = `${hh}:${mm}:${ss}`;
      document.getElementById('status-time').textContent  = `${hh}:${mm}`;
      document.getElementById('day-date').textContent =
        `${DAYS[now.getDay()]} ${MONTHS[now.getMonth()]} ${now.getDate()}`;
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
